name: Release
# Builds downloads for Windows, Mac (Apple Silicon and Intel) and Linux when you push a version tag, e.g.:
#   git tag v0.3.0 && git push origin v0.3.0
# The finished files appear under the repository's Releases page. You can also run it by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: Backwoods-Dash-Designer-windows.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: Backwoods-Dash-Designer-mac-apple-silicon.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: Backwoods-Dash-Designer-mac-intel.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: Backwoods-Dash-Designer-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bw-dash-designer.exe" "dist/Backwoods Dash Designer.exe"
          Copy-Item LICENSE, NOTICE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.asset }}"
      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          APP="Backwoods Dash Designer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp assets/DashDesigner.icns "$APP/Contents/Resources/DashDesigner.icns"
          cp "target/${{ matrix.target }}/release/bw-dash-designer" "$APP/Contents/MacOS/bw-dash-designer"
          sed -n "/<<'P'/,/^P\$/p" make_app.sh | sed '1d;$d' > "$APP/Contents/Info.plist"
          cp LICENSE NOTICE "$APP/Contents/Resources/"
          ditto -c -k --keepParent "$APP" "${{ matrix.asset }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg
          cp target/${{ matrix.target }}/release/bw-dash-designer LICENSE NOTICE README.md pkg/
          tar -czf "${{ matrix.asset }}" -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
